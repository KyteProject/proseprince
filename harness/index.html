<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>ProsePrince Harness</title>
	<link rel="stylesheet" href="../styles.css" />
	<style>
		body { margin: 0; padding: 16px; font: 16px/1.6 Georgia, serif; background: #fbfaf7; color: #222; }
		body.theme-dark { background: #1e1e1e; color: #ddd; }
		#controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; font-family: system-ui, sans-serif; }
		button { padding: 6px 10px; border-radius: 6px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
		.cm-editor { max-width: 720px; border: 1px solid #ddd; border-radius: 8px; background: transparent; }
		.cm-content { padding: 12px 16px; font: inherit; }
		.cm-editor.cm-focused { outline: 2px solid #9ab; }
	</style>
</head>
<body class="theme-light">
	<div id="controls"></div>
	<div id="editor"></div>
	<div id="status" style="margin-top:8px;font:13px system-ui;color:#666"></div>
	<script src="dist/harness.js"></script>
</body>
</html>
